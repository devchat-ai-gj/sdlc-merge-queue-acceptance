name: Check the proposed commit
on:
  push:
    branches:
      - 'codex/sdlc0062-*'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Run candidate check
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        make ci
